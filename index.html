<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Finanças Conscientes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <!-- VLibras Plugin -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

    <div class="container" id="app-container">

        <div id="tela-avaliacao" class="screen">
            <h2 class="title-avaliacao">Escala de Avaliação de Compra</h2>
            <p class="subtitle-avaliacao"></p>
            <form id="avaliacaoForm">
                <div id="perguntasContainer" aria-live="polite">
                    <!-- perguntas serão renderizadas aqui -->
                </div>

                <!-- Template usado pelo script para criar cada pergunta dinamicamente -->
                <template id="pergunta-template">
                    <div class="pergunta-item" data-question="">
                        <p class="question-title audio-clickable" data-audio=""></p>
                        <div class="opcoes-wrap">
                            <!-- cada opção será clonada -->
                            <label class="opcao-label audio-clickable" data-audio="">
                                <input type="radio" name="__NAME__" value="__VALUE__" required> 
                                <span class="opcao-text">__OPTION_TEXT__</span> <span class="pontos">__EMOJI__</span>
                            </label>
                        </div>
                    </div>
                </template>

                <div class="botoes-form">
                    <button type="button" id="voltarPergunta" class="btn-secundario hidden">Voltar</button>
                </div>
            </form>
            <button id="audioDescricaoAvaliacao" class="btn-acessibilidade">Ouvir descrição da tela</button>
        </div>
        <div class="redes-sociais">
  <a href="https://www.instagram.com/financeiramente.ifpe?igsh=ZXNyN2J4OTZ3cGI2" target="_blank">
    <img src="icons8-instagram-48.png" alt="Instagram" class="icone-instagram">
  </a>
  <a href="https://portal.ifpe.edu.br/igarassu/" target="_blank">
    <img src="ifrs.png" alt="logo" class="logo">
  </a>
</div>

        <div id="tela-resultado" class="screen hidden">
            <div class="card-resultado">
                <p class="pontuacao-label">pontos no total</p>
                <div id="circulo-pontuacao">
                    <span id="pontuacao-final" data-audio="Pontuação final: 0">0</span>
                </div>
                <h2 id="titulo-resultado" class="high-risk" data-audio=""> </h2>
                <p id="mensagem-dica" data-audio=""></p>

                <div class="tabela-pontuacao">
                    <h3>Entenda sua pontuação:</h3>
                    <table>
                        <tr>
                            <td>0-1 ponto</td>
                            <td class="verde">Compra consciente</td>
                        </tr>
                        <tr>
                            <td>2-4 pontos</td>
                            <td class="amarelo">Atenção necessária</td>
                        </tr>
                        <tr>
                            <td>5-6 pontos</td>
                            <td class="vermelho">Alto risco</td>
                        </tr>
                    </table>
                </div>

                <div class="botoes-resultado">
                    <button type="button" id="responderNovamente" class="btn-secundario">Responder novamente</button>
                </div>
            </div>
            <button id="audioDescricaoResultado" class="btn-acessibilidade">Ouvir descrição da tela</button>
        </div>

    </div>

    

    <script src="script.js"></script>
</body>


</html>
